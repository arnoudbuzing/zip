name: Build ZipLink Libraries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libzip_link.dylib
            wstp_system_id: MacOSX-ARM64
            wstp_lib: libWSTPi4.a
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zip_link.dll
            wstp_system_id: Windows-x86-64
            wstp_lib: wstp64i4.lib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libzip_link.so
            wstp_system_id: Linux-x86-64
            wstp_lib: libWSTP64i4.a
            use_zig: true

    env:
      WSTP_COMPILER_ADDITIONS_DIRECTORY: ${{ github.workspace }}/WSTP/${{ matrix.wstp_system_id }}/CompilerAdditions
      WSTP_COMPILER_ADDITIONS: ${{ github.workspace }}/WSTP/${{ matrix.wstp_system_id }}/CompilerAdditions/${{ matrix.wstp_lib }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y uuid-dev

      - name: Install zigbuild (Linux)
        if: matrix.use_zig
        run: pip install cargo-zigbuild

      - name: Install zig (Linux)
        if: matrix.use_zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zip_link

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "--- macOS WSTP Debug ---"
            ls -al "$WSTP_COMPILER_ADDITIONS_DIRECTORY"
            lipo -info "$WSTP_COMPILER_ADDITIONS_DIRECTORY/libWSTPi4.a"
            # Extract a true thin library as wstp-sys expects on macOS
            echo "Extracting arm64 slice to libWSTP-thin.a..."
            lipo -extract arm64 "$WSTP_COMPILER_ADDITIONS_DIRECTORY/libWSTPi4.a" -output "$WSTP_COMPILER_ADDITIONS_DIRECTORY/libWSTP-thin.a"
            # Ensure the linker finds it
            export LIBRARY_PATH="$WSTP_COMPILER_ADDITIONS_DIRECTORY:$LIBRARY_PATH"
            export RUSTFLAGS="-L $WSTP_COMPILER_ADDITIONS_DIRECTORY"
          fi
          echo "Listing all files for final debug..."
          ls -R
          echo "Building..."
          if [ "${{ matrix.use_zig }}" = "true" ]; then
            # Add host library paths to help find libuuid
            export LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/lib64:$LIBRARY_PATH
            # Use a linker version script to isolate symbols and prevent exit crashes on Linux
            export RUSTFLAGS="-L /usr/lib/x86_64-linux-gnu -L /lib64 -lrt -C link-arg=-Wl,--version-script=version.map -C link-arg=-Wl,--undefined-version"
            cd zip_link && cargo zigbuild --release --target ${{ matrix.target }}.2.17
          else
            cd zip_link && cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage Artifact
        shell: bash
        run: |
          mkdir -p staging
          cp zip_link/target/${{ matrix.target }}/release/${{ matrix.artifact }} staging/ 2>/dev/null || \
          cp zip_link/target/${{ matrix.target }}.2.17/release/${{ matrix.artifact }} staging/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-library
          path: staging/${{ matrix.artifact }}
          if-no-files-found: error
