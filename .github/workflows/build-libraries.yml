name: Build ZipLink Libraries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libzip_link.dylib
            wstp_system_id: MacOSX-ARM64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zip_link.dll
            wstp_system_id: Windows-x86-64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libzip_link.so
            wstp_system_id: Linux-x86-64
            use_zig: true

    env:
      WSTP_COMPILER_ADDITIONS_DIRECTORY: ${{ github.workspace }}/WSTP/${{ matrix.wstp_system_id }}/CompilerAdditions

    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y uuid-dev

      - name: Install zigbuild (Linux)
        if: matrix.use_zig
        run: pip install cargo-zigbuild

      - name: Install zig (Linux)
        if: matrix.use_zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zip_link

      - name: Build
        shell: bash
        run: |
          echo "Listing files to debug structure..."
          ls -R
          echo "Building..."
          if [ "${{ matrix.use_zig }}" = "true" ]; then
            # Add host library path to help find libuuid, but zig will still link against target glibc
            export LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LIBRARY_PATH
            cd zip_link && cargo zigbuild --release --target ${{ matrix.target }}.2.17
          else
            cd zip_link && cargo build --release --target ${{ matrix.target }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-library
          path: |
            zip_link/target/${{ matrix.target }}/release/${{ matrix.artifact }}
            zip_link/target/${{ matrix.target }}.2.17/release/${{ matrix.artifact }}
          if-no-files-found: error
