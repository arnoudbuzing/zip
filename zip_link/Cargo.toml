[package]
name = "zip_link"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
zip = { version = "0.6", features = ["bzip2", "zstd"] }
wolfram-library-link = "0.2.1"
wolfram-expr = "0.1.4"
walkdir = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
